name: Release

# A version tag (v1.0.0…) builds, tests and publishes the executables.
# "Run workflow" in the Actions tab builds and tests without publishing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: npm ci
      - run: npm run package
      # A raw binary downloaded by a browser loses its executable bit; an
      # archive keeps it.
      - name: Archive the macOS and Linux executables
        working-directory: release
        run: |
          for f in portfolio-tracker-macos-arm64 portfolio-tracker-macos-x64; do
            zip -j "$f.zip" "$f"
          done
          tar -czf portfolio-tracker-linux-x64.tar.gz portfolio-tracker-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            release/*.exe
            release/*.zip
            release/*.tar.gz
          if-no-files-found: error

  # Runs each executable on its own system: cross-compiled binaries cannot be
  # trusted until they have actually started there.
  smoke-test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            file: portfolio-tracker-windows-x64.exe
          - os: macos-latest
            file: portfolio-tracker-macos-arm64.zip
          - os: ubuntu-latest
            file: portfolio-tracker-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
      - name: Start the executable and check it serves the app
        shell: bash
        run: |
          file="${{ matrix.file }}"
          case "$file" in
            *.zip) unzip -o "$file"; exe="./${file%.zip}" ;;
            *.tar.gz) tar -xzf "$file"; exe="./${file%.tar.gz}" ;;
            *) exe="./$file" ;;
          esac
          "$exe" --no-browser &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4719/api/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:4719/api/health | grep -q portfolio-tracker
          curl -sf http://127.0.0.1:4719/ | grep -q '<div id="root">'
          echo "OK sur ${{ matrix.os }}"

  publish:
    needs: smoke-test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" release/* \
            --title "Portefeuille ${{ github.ref_name }}" \
            --notes-file .github/release-notes.md
